<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <title>My Portfolio</title>
</head>
<body>
  <div class="container">
    <h1 class="my-4">My Projects</h1>

    <div class="card project-card" style="width: 18rem; margin: 1rem;">
      <!-- Project Screenshot -->
      <img src="images/project-placeholder.png" class="card-img-top" alt="Project Screenshot">

      <!-- Project Body -->
  <div class="card-body">
    <!-- Project Title -->
    <h5 class="card-title">Project Name</h5>
    
    <!-- Short Description -->
    <p class="card-text">
      Brief description of the project’s purpose, technologies used, and high-level goal.
    </p>
    
    <!-- Role / Contributions -->
    <ul>
      <li>Key responsibility or contribution #1</li>
      <li>Key responsibility or contribution #2</li>
      <li>Key responsibility or contribution #3</li>
    </ul>
    
    <!-- Tech Tags -->
    <div class="tags">
      <span class="badge bg-primary">#java</span>
      <span class="badge bg-secondary">#csharp</span>
      <span class="badge bg-success">#backend</span>
      <span class="badge bg-warning text-dark">#devops</span>
      <span class="badge bg-info text-dark">#testing</span>
    </div>
    
    <!-- Links -->
    <div class="project-links" style="margin-top: 0.5rem;">
      <a href="https://github.com/dlee/project-repo" class="btn btn-outline-primary btn-sm" target="_blank">GitHub Repo</a>
      <a href="#" class="btn btn-outline-success btn-sm disabled" target="_blank">Live Demo</a>
    </div>
  </div>
</div>
<!-- End of Project Card -->
    <!-- Repeat the above card structure for each project -->

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
